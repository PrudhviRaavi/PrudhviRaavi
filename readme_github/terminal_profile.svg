<svg width="650" height="380" viewBox="0 0 650 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="380" rx="10" fill="#1E1E2E"/>
  <rect width="650" height="30" rx="10" fill="#313244"/>
  <rect x="0" y="15" width="650" height="15" fill="#313244"/>
  <circle cx="20" cy="15" r="5" fill="#F38BA8"/>
  <circle cx="40" cy="15" r="5" fill="#F9E2AF"/>
  <circle cx="60" cy="15" r="5" fill="#A6E3A1"/>
  <text x="325" y="20" text-anchor="middle" fill="#CDD6F4" font-family="monospace" font-size="12">prudhvi@macbook — python3</text>
  
  <text x="20" y="60" fill="#A6E3A1" font-family="monospace" font-size="14">&gt; python profile.py</text>
  
  <text x="20" y="90" fill="#F38BA8" font-family="monospace" font-size="14">class <tspan fill="#F9E2AF">PrudhviRaavi</tspan><tspan fill="#CDD6F4">:</tspan></text>

  <text x="40" y="115" fill="#F38BA8" font-family="monospace" font-size="14">def <tspan fill="#89B4FA">__init__</tspan><tspan fill="#CDD6F4">(self):</tspan></text>
  <text x="60" y="140" fill="#CDD6F4" font-family="monospace" font-size="14">self.name      = <tspan fill="#A6E3A1">"Prudhvi Krishna Raavi"</tspan></text>
  <text x="60" y="160" fill="#CDD6F4" font-family="monospace" font-size="14">self.degree    = <tspan fill="#A6E3A1">"B.Tech CSE (AI &amp; DS)"</tspan></text>
  <text x="60" y="180" fill="#CDD6F4" font-family="monospace" font-size="14">self.skills    = <tspan fill="#CDD6F4">[</tspan><tspan fill="#A6E3A1">"Python", "Full Stack Dev", "AI Engineering"</tspan><tspan fill="#CDD6F4">]</tspan></text>
  <text x="60" y="200" fill="#CDD6F4" font-family="monospace" font-size="14">self.interests = <tspan fill="#CDD6F4">[</tspan><tspan fill="#A6E3A1">"Cloud Architecture", "Data Engineering", "Web3"</tspan><tspan fill="#CDD6F4">]</tspan></text>
  
  <text x="40" y="235" fill="#F38BA8" font-family="monospace" font-size="14">def <tspan fill="#89B4FA">say_hi</tspan><tspan fill="#CDD6F4">(self):</tspan></text>
  <text x="60" y="260" fill="#89B4FA" font-family="monospace" font-size="14">print<tspan fill="#CDD6F4">(</tspan><tspan fill="#A6E3A1">"Thanks for dropping by! Let's build together 🚀"</tspan><tspan fill="#CDD6F4">)</tspan></text>

  <text x="20" y="300" fill="#CDD6F4" font-family="monospace" font-size="14">me = PrudhviRaavi()</text>
  <text x="20" y="325" fill="#CDD6F4" font-family="monospace" font-size="14">me.say_hi()</text>

  <rect x="20" y="355" width="10" height="15" fill="#CDD6F4">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
